# Production stack for the Hostinger VPS (srv1304241 / 82.25.95.86).
# PostgreSQL + API only. The web (Next.js) runs on Vercel.
#
# Integrates with the VPS's EXISTING Traefik reverse proxy (Docker provider,
# opt-in) via the external `traefik-proxy` network + labels — same pattern as the
# other stacks on the box (whisperall-api, etc.). NO published ports, so there is
# ZERO conflict with Traefik/Odoo/n8n/whisperall. Traefik issues the TLS cert via
# the existing `letsencrypt` resolver once API_DOMAIN resolves to this host.
#
# VPS-agnostic: containers + .env + named volumes. Moving VPS = install Docker,
# copy the repo + .env, restore the postgres dump and the api_storage volume,
# `docker compose -f docker-compose.prod.yml up -d`, repoint DNS. On a VPS without
# Traefik, add a reverse proxy (e.g. Caddy) in front of the api:4000 port.
#
# Usage on the VPS:
#   cp .env.production.example .env   # then edit with real values
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    # Internal only — never published to the host or the public internet.
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - internal
      - traefik-proxy
    # Bounded so the LMS can never starve the other production apps on the box.
    mem_limit: 768m
    cpus: 1.5
    volumes:
      - api_storage:/app/storage
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - "traefik.http.routers.tsc-api.rule=Host(`${API_DOMAIN}`)"
      - traefik.http.routers.tsc-api.entrypoints=websecure
      - traefik.http.routers.tsc-api.tls.certresolver=letsencrypt
      - traefik.http.services.tsc-api.loadbalancer.server.port=4000

networks:
  internal:
  traefik-proxy:
    external: true

volumes:
  postgres_data:
  api_storage:
